# Optional NVIDIA GPU acceleration for the TTS service.
#
# Kept in a separate overlay rather than in docker-compose.yml because a
# `deploy.resources.reservations.devices` block fails `docker compose up`
# outright on any host without nvidia-container-toolkit installed - it does not
# degrade, it refuses to start the whole stack. Since the toolkit needs root to
# install and configure, requiring it just to run the app would be a hard
# blocker for most people. tts/main.py already falls back to CPU cleanly.
#
# Prerequisites on the host:
#   1. NVIDIA driver installed (verify: nvidia-smi)
#   2. sudo apt install nvidia-container-toolkit
#   3. sudo nvidia-ctk runtime configure --runtime=docker
#   4. sudo systemctl restart docker      # NB: restarts all containers
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  tts:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
