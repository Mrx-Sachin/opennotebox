services:
  postgres:
    image: ${EXISTING_POSTGRES_IMAGE:?Set the existing PostgreSQL image}

  api:
    image: ${BACKEND_IMAGE:?Set the validated backend image}
    build: !reset null
    volumes: !override
      - ${EXISTING_DATA_DIR:?Set the existing data directory}:/app/data
      - ${EXISTING_EXPORT_DIR:?Set the existing export directory}:/app/exports
    environment:
      META_API_KEY: ${META_API_KEY:-}

  worker:
    image: ${BACKEND_IMAGE:?Set the validated backend image}
    build: !reset null
    volumes: !override
      - ${EXISTING_DATA_DIR:?}:/app/data
      - ${EXISTING_EXPORT_DIR:?}:/app/exports
    environment:
      META_API_KEY: ${META_API_KEY:-}

  worker-tts:
    image: ${BACKEND_IMAGE:?Set the validated backend image}
    build: !reset null
    volumes: !override
      - ${EXISTING_DATA_DIR:?}:/app/data
    environment:
      META_API_KEY: ${META_API_KEY:-}

  beat:
    image: ${BACKEND_IMAGE:?Set the validated backend image}
    build: !reset null
    volumes: !override
      - ${EXISTING_DATA_DIR:?}:/app/data
      - ${EXISTING_EXPORT_DIR:?}:/app/exports

  frontend:
    image: ${FRONTEND_IMAGE:?Set the validated frontend image}
    build: !reset null

  traefik:
    volumes: !override
      - ${RELEASE_CONFIG_DIR:?Set the release Traefik configuration directory}/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${RELEASE_CONFIG_DIR:?}/dynamic:/etc/traefik/dynamic:ro
      - ${EXISTING_CERTS_DIR:?Set the existing certificates directory}:/etc/traefik/certs:ro

  omniroute-bridge:
    image: ${BACKEND_IMAGE:?Set the validated backend image}
    entrypoint: [python, /opt/omniroute_bridge.py]
    command: []
    network_mode: host
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8766"
      BRIDGE_ALLOWED_CIDRS: "127.0.0.0/8,172.16.0.0/12,10.0.0.0/8"
