[project]
name = "open-notebox"
version = "0.1.0"
description = "AI-powered document reader with synced TTS highlighting"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    # psycopg 3 serves both the sync engine and the async engine, so there is
    # exactly one Postgres driver to install, pin and reason about (asyncpg
    # would mean a second one with its own type-adaptation quirks).
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "loguru>=0.7.2",
    "aiofiles>=23.2.1",
    "websockets>=12.0",
    "langchain>=1.3.9,<2",
    "langchain-core>=1.4.6,<2",
    "langchain-openai>=1.1.14,<2",
    "langgraph>=1.0.5,<2",
    "tiktoken>=0.12.0",
    "ai-prompter>=0.4,<1",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    # FSRS (Free Spaced Repetition Scheduler), Anki's default scheduler since
    # 23.10 and the successor to SM-2. Using the maintained py-fsrs package
    # for the actual difficulty/stability/retrievability math instead of
    # hand-rolling it - see services/fsrs_scheduler.py. Pure Python, no
    # torch/numpy pulled in unless its optional Optimizer is imported.
    "fsrs>=6.3,<7",
    "psutil>=5.9.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Without this, setuptools' flat-layout autodiscovery finds both `app/` and
# `alembic/` at the top level, decides the layout is ambiguous, and refuses to
# build at all ("Multiple top-level packages discovered"). Only `app` is the
# importable package; `alembic/` is migration scripts run by the alembic CLI.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Auto-generated migration scripts are Alembic's output, not hand-written
# code - don't hold them to the same lint bar.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Ruff's own recommended baseline (pyflakes, plus the pycodestyle codes
# considered safe/uncontroversial to enable by default): unused imports and
# variables, undefined names, bare except, ambiguous identifiers, etc. Not
# layering on stricter categories (docstrings, complexity, blind-except,
# datetime-tz, ...) yet - this is meant to catch real bugs, not to be a
# style mandate on day one of CI existing. Tighten later as the codebase
# earns it.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
