# TLS material generated by scripts/gen-certs.sh.
#
# Set as the default certificate rather than tied to a SNI hostname, because
# the app is reached by bare IP as often as by name (https://192.168.1.31 from
# a phone), and an IP request carries no SNI for a hostname rule to match.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/server.crt
        keyFile: /etc/traefik/certs/server.key
  certificates:
    - certFile: /etc/traefik/certs/server.crt
      keyFile: /etc/traefik/certs/server.key
