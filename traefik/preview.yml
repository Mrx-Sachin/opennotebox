http:
  routers:
    api:
      rule: 'PathPrefix(`/api`) || PathPrefix(`/ws`) || Path(`/health`)'
      priority: 100
      entryPoints: [weblocal]
      service: api
    frontend:
      rule: 'PathPrefix(`/`)'
      priority: 1
      entryPoints: [weblocal]
      service: frontend
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3000
