name: Validate application

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked test dependencies
        run: |
          python -m pip install uv==0.11.27
          uv export --frozen --extra dev --no-emit-project --output-file /tmp/opennotebox-requirements.txt
          uv pip install --system --requirement /tmp/opennotebox-requirements.txt
      - name: Run backend tests including Redis admission
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install browser tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check gallery, reader, and streaming using isolated API fixtures
        shell: bash
        run: |
          cp -r frontend/public frontend/.next/standalone/public
          cp -r frontend/.next/static frontend/.next/standalone/.next/static
          HOSTNAME=127.0.0.1 PORT=3101 node frontend/.next/standalone/server.js > /tmp/opennotebox-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3101/login > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3101/login > /dev/null
          cd e2e
          E2E_BASE_URL=http://127.0.0.1:3101 npx playwright test tests/library.spec.ts tests/library.phone.spec.ts tests/chat-stream.spec.ts tests/notebooks.spec.ts tests/notebooks.phone.spec.ts tests/shared-library.spec.ts tests/shared-library.phone.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            e2e/test-results
            /tmp/opennotebox-frontend.log
